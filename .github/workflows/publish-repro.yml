name: Publish full reproduction package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-repro.yml"
      - "artifacts/parts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artifacts/full-repro-v9.tar.xz ]; then
            echo "Full archive is already assembled."
            exit 0
          fi
          cat artifacts/parts/full-repro-v9.part-*.b64 | tr -d '\\r\\n ' | base64 --decode > /tmp/full-repro-v9.tar.xz
          echo "0f8ea1cde41415fdc472247736ffc60de116c902aec1d7152d380a3bf1d5ee53  /tmp/full-repro-v9.tar.xz" | sha256sum -c -

      - name: Publish repository contents
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artifacts/full-repro-v9.tar.xz ]; then
            echo "Nothing to publish."
            exit 0
          fi
          tar -xJf /tmp/full-repro-v9.tar.xz
          mkdir -p artifacts
          cp /tmp/full-repro-v9.tar.xz artifacts/full-repro-v9.tar.xz
          rm -rf artifacts/parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Publish complete v9 reproduction package"
          git push
